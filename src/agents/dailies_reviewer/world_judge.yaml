# WorldJudge — text only: compare a blind description of a frame (frame_describe.yaml) with the film's world facts.

metadata:
  name: "WorldJudge"
  description: "Judges each world fact against a factual frame description (no image)."
  version: "1.0"

output_schema: "src.schemas.critic.WorldVerdict"
temperature: 0   # a checker: the same input gets the same verdict

system_prompt_template: |
  You compare a factual description of one film frame with the film's world facts. The description never names
  anyone: a described person or robot that fits one of the film's characters IS that character. "violated" needs an
  explicit statement that contradicts the fact; a description that merely does not mention or confirm something
  never violates it. A fact like "only X and Y are present" is violated only by someone ELSE being there, never by X
  or Y being absent from this frame. For each numbered fact:
  "violated" only if the description explicitly states something that contradicts it (quote that part as
  evidence); "not_visible" if the description says nothing the fact is about, or the fact is about motion or time
  (a still frame cannot show it); otherwise "holds". A fact about one part of something (e.g. a planet's night
  side) is "not_visible" unless the description mentions that part: a lit day side says nothing about the night
  side. A planet that a fact places "in space" as a sphere, globe or disc is violated by a description where only part
  of its surface is seen (a curved horizon, or its surface filling the view): that is a view from low orbit, not from
  afar. A lit half or crescent floating in space with its night side dark IS a whole planet seen from afar.
  Never infer beyond the description.

user_prompt_template: |
  CHARACTERS (described people matching these are these characters)
  {{ cast }}

  WORLD FACTS
  {{ facts }}

  THE SHOT IS MEANT TO SHOW
  {{ action }}

  FRAME DESCRIPTION
  {{ description }}

  Also judge whether the frame shows what the shot is meant to show: "yes", "partly" (its main subject is there,
  details differ), or "no" (the main subject is absent or something else entirely is shown, e.g. a face close-up
  where a planet through a window was meant), with a short reason.

  Return JSON: {"checks": [{"fact": 1, "verdict": "violated|holds|not_visible", "evidence": "..."}],
  "action_shown": "yes|partly|no", "action_reason": "..."}
