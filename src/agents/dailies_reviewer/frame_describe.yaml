# FrameDescribe — describe a keyframe WITHOUT being told what it should contain. The world-fact judgment is made
# afterwards from this description (world_judge.yaml, text only): a VLM primed with "the night side has no lights"
# reported city lights on a fully lit day-side Earth; a blind description does not have that bias.

metadata:
  name: "FrameDescribe"
  description: "Blind, factual description of one image: people, what is outside windows / in the sky, objects."
  version: "1.0"

output_schema: "src.schemas.critic.FrameDescription"

system_prompt_template: |
  Describe the FIRST image factually and literally. Do not interpret, do not guess what it should show.
  - people: one entry per visible person or robot/creature (what they look like, where they are in frame)
  - outside_view: what is visible through windows or in the sky: each object (planet, moon, sun, city, landscape),
    how many of each, its size in frame, which parts are lit or dark, and whether any dark part shows lights. For a
    planet or moon say whether it is seen whole, floating in space (a full disc, or a lit half / crescent with a
    round edge whose night side is dark against the sky), or only a part of its surface (a curved horizon or ground
    filling much of the view)
  - bodies: one entry per planet, moon or sun visible: its name if recognisable (Earth, Moon, Sun) else "planet",
    and view "whole" (its round outline is seen with sky around it; a lit half or crescent whose night side is dark
    counts as whole) or "partial" (only part of its surface: a curved horizon, or its surface filling much of the view)
  - objects: other notable objects
  - visible_text: any large text-like marks (signs, screens), copied as seen

user_prompt_template: |
  Return JSON: {"people": ["..."], "outside_view": "...", "bodies": [{"name": "...", "view": "whole|partial"}],
  "objects": ["..."], "visible_text": ["..."]}
